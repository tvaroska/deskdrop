<!doctype html>
<html lang="en">
<head><title>Platform Status Console</title></head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col">
  <div class="layout-shell max-w-7xl mx-auto px-6 py-8 w-full grid grid-cols-12 gap-6" data-layout-version="2026.11" data-theme-token="surface-0">
    <header class="col-span-12 flex items-center justify-between border-b border-slate-800 pb-4">
      <div class="flex items-center space-x-4">
        <h1 class="text-2xl font-semibold tracking-tight text-slate-50">Platform Status Console</h1>
        <span class="inline-flex items-center rounded-full px-3 py-1 text-xs font-medium bg-emerald-900/40 text-emerald-300" data-status-pill="overall">All Systems Operational</span>
      </div>
      <div class="flex items-center space-x-3 text-sm text-slate-400">
        <span>Active Incidents:</span>
        <strong class="font-mono text-slate-100" data-incident-counter="open">0</strong>
      </div>
    </header>
    <main class="col-span-12 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4" data-grid-container="services">
        <section class="v2-svc-card rounded-xl border border-slate-800 bg-slate-900/60 p-5 shadow-sm flex flex-col justify-between">
          <div class="flex items-center justify-between mb-3">
            <div class=" wrapper-outer flex flex-col "><div class="wrapper-inner"><h3 class="svc-title text-base font-medium text-white">API Gateway</h3></div></div>
            <span class="svc-state rounded-md px-2 py-0.5 text-xs bg-emerald-500/10 text-emerald-400">Operational</span>
          </div>
          <div class="text-xs text-slate-400 flex justify-between"><span>30d SLA</span><span class="font-mono text-slate-200" data-metric-id="sla">99.99%</span></div>
        </section>
        <section class="v2-svc-card rounded-xl border border-slate-800 bg-slate-900/60 p-5 shadow-sm flex flex-col justify-between">
          <div class="flex items-center justify-between mb-3">
            <div class=" wrapper-outer flex flex-col "><div class="wrapper-inner"><h3 class="svc-title text-base font-medium text-white">Worker Relay</h3></div></div>
            <span class="svc-state rounded-md px-2 py-0.5 text-xs bg-emerald-500/10 text-emerald-400">Operational</span>
          </div>
          <div class="text-xs text-slate-400 flex justify-between"><span>30d SLA</span><span class="font-mono text-slate-200" data-metric-id="sla">99.97%</span></div>
        </section>
        <section class="v2-svc-card rounded-xl border border-slate-800 bg-slate-900/60 p-5 shadow-sm flex flex-col justify-between">
          <div class="flex items-center justify-between mb-3">
            <div class=" wrapper-outer flex flex-col "><div class="wrapper-inner"><h3 class="svc-title text-base font-medium text-white">Blob Storage</h3></div></div>
            <span class="svc-state rounded-md px-2 py-0.5 text-xs bg-emerald-500/10 text-emerald-400">Operational</span>
          </div>
          <div class="text-xs text-slate-400 flex justify-between"><span>30d SLA</span><span class="font-mono text-slate-200" data-metric-id="sla">99.91%</span></div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
