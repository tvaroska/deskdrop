<!doctype html>
<html>
<head><title>Example Status v1</title></head>
<body>
  <main>
    <div class="banner-state">All Systems Operational</div>
    <div class="incident-count">0 active incidents</div>
    <section class="services">
      <div class="metric-row">
        <span class="svc-name">API Gateway</span>
        <span class="svc-state">Operational</span>
        <span class="svc-uptime">99.98%</span>
      </div>
      <div class="metric-row">
        <span class="svc-name">Worker Relay</span>
        <span class="svc-state">Operational</span>
        <span class="svc-uptime">99.95%</span>
      </div>
      <div class="metric-row">
        <span class="svc-name">Blob Storage</span>
        <span class="svc-state">Degraded</span>
        <span class="svc-uptime">98.40%</span>
      </div>
    </section>
  </main>
</body>
</html>
