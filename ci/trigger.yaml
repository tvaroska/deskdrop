# Cloud Build trigger definitions for DeskDrop (2nd-gen GitHub connection)
#
# Replace <PROJECT_ID>, <PROJECT_NUMBER>, <GITHUB_CONNECTION>, and <GITHUB_REPO>
# locally before applying with:
#   gcloud builds triggers import \
#     --project=<PROJECT_ID> \
#     --region=us-central1 \
#     --source=ci/trigger.yaml
name: deskdrop-tag
description: Release test, cross-build, container scan, Artifact Registry push, and Flux GitOps rollout on vX.Y.Z tag
filename: cloudbuild.yaml
repositoryEventConfig:
  repository: projects/<PROJECT_ID>/locations/us-central1/connections/<GITHUB_CONNECTION>/repositories/<GITHUB_REPO>
  push:
    tag: ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$
serviceAccount: projects/<PROJECT_ID>/serviceAccounts/cloudbuild-gitops-sa@<PROJECT_ID>.iam.gserviceaccount.com
---
name: deskdrop-main
description: Continuous integration test and build verification on main branch (no release push)
filename: cloudbuild.yaml
repositoryEventConfig:
  repository: projects/<PROJECT_ID>/locations/us-central1/connections/<GITHUB_CONNECTION>/repositories/<GITHUB_REPO>
  push:
    branch: ^main$
serviceAccount: projects/<PROJECT_ID>/serviceAccounts/<PROJECT_NUMBER>-compute@developer.gserviceaccount.com
